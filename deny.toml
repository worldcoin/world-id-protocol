[graph]
all-features = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# world-id-protocol-solana: our own Solana satellite program, depended on via
# git (see services/relay/Cargo.toml). world-id-protocol (self): pulled back
# in transitively, since world-id-solana itself depends on world-id-primitives
# via a git dependency on this same repo (see world-id-protocol-solana's
# Cargo.toml) -- TODO: drop once worldcoin/world-id-protocol#797 merges to
# main and that branch pin is removed.
allow-git = [
    "https://github.com/worldcoin/world-id-protocol-solana",
    "https://github.com/worldcoin/world-id-protocol",
]

[bans]
deny = [
    { name = "openssl-sys", reason = "increases complexity for foreign binding compilation and bundle size" },
    { name = "openssl", reason = "increases complexity for foreign binding compilation and bundle size" },
    { crate = "metrics", deny-multiple-versions = true, reason = "metrics crate uses a global recorder - multiple versions may break metrics silently" },
]

[licenses]
version = 2
confidence-threshold = 1.0

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    # "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",                        # Although this is copyleft, it is scoped to modifying the original files
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# solana-config-interface ships Apache-2.0 (see its LICENSE file) but declares
# it via `license-file` rather than an SPDX `license` string, which the
# confidence-threshold above (1.0) can't auto-classify with full confidence.
[[licenses.clarify]]
name = "solana-config-interface"
expression = "Apache-2.0"
license-files = []

[advisories]
ignore = [
    "RUSTSEC-2024-0388", # Unmaintained `derivative` (2024-11-22)
    "RUSTSEC-2024-0436", # Unmaintained `paste` (2025-04-04)
    "RUSTSEC-2025-0055", # `tracing-subscriber` < 0.3.20, requires bumps on `semaphore-rs` (and Ark deps) (2025-09-09)
    "RUSTSEC-2023-0089", # Unmaintained `atomic-polyfill` (2025-04-29)
    "RUSTSEC-2025-0057", # Unmaintained `fxhash` (2026-04-10), requires bumps on `provekit`
    "RUSTSEC-2025-0141", # Unmaintained `bincode` (2026-04-10), requires bumps on `provekit`
    "RUSTSEC-2026-0074", # `libcrux-sha3` via testcontainers->russh; dev-only, does not affect our usage (2026-03-26)
    "RUSTSEC-2026-0207", # `libcrux-sha3` SHAKE incremental API; via testcontainers->russh->libcrux-ml-kem; dev-only, no safe upgrade (2026-07-21)
    "RUSTSEC-2026-0208", # `libcrux-sha3` AVX2 SHAKE-256 panic; via testcontainers->russh->libcrux-ml-kem; dev-only, no safe upgrade (2026-07-21)
    "RUSTSEC-2026-0212", # `libcrux-secrets`/`libcrux-sha3` const-time swap on aarch64; via testcontainers->russh->libcrux-ml-kem; dev-only, no safe upgrade (2026-07-21)
    "RUSTSEC-2026-0153", # russh-cryptovec broken, via testcontainers, dev-only, does not affect our usage (2026-06-02)
    "RUSTSEC-2026-0154", # russh-cryptovec broken, via testcontainers, dev-only, does not affect our usage (2026-06-02)
    "RUSTSEC-2026-0173", # Unmaintained `proc-macro-error2`; transitive via alloy-sol-macro, no safe upgrade available (2026-06-08)
    "RUSTSEC-2021-0139", # Unmaintained `ansi_term`; via litesvm (world-id-solana feature, anchor-litesvm dev-dependency), dev-only, no safe upgrade available (2026-07)
    "RUSTSEC-2025-0161", # Unmaintained `libsecp256k1`; via agave-syscalls/litesvm (world-id-solana feature, anchor-litesvm dev-dependency), dev-only, no safe upgrade available (2026-07)
    "RUSTSEC-2026-0205", # `Array::insert` exception-safety issue in `scc` 2.4.0; via serial_test (world-id-indexer dev-dependency), dev-only; fix requires scc >=3.8.4, a major bump serial_test doesn't permit yet (2026-07-24)
]
