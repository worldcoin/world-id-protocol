[graph]
all-features = true

[sources]
unknown-registry = "deny"

[bans]
deny = [
    { name = "openssl-sys", reason = "increases complexity for foreign binding compilation and bundle size" },
    { name = "openssl", reason = "increases complexity for foreign binding compilation and bundle size" },
    { crate = "metrics", deny-multiple-versions = true, reason = "metrics crate uses a global recorder - multiple versions may break metrics silently" },
]

[licenses]
version = 2
confidence-threshold = 1.0

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    # "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",                        # Although this is copyleft, it is scoped to modifying the original files
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
ignore = [
    "RUSTSEC-2024-0388", # Unmaintained `derivative` (2024-11-22)
    "RUSTSEC-2024-0436", # Unmaintained `paste` (2025-04-04)
    "RUSTSEC-2023-0089", # Unmaintained `atomic-polyfill` (2025-04-29)
    "RUSTSEC-2026-0247", # Unmaintained `bitmaps`; transitive via `provekit`, no safe upgrade available (2026-08-11)
    "RUSTSEC-2026-0248", # Unmaintained `im`; transitive via `provekit`, no safe upgrade available (2026-08-11)
    "RUSTSEC-2026-0251", # Unmaintained `sized-chunks`; transitive via `provekit`, no safe upgrade available (2026-08-11)
    "RUSTSEC-2026-0173", # Unmaintained `proc-macro-error2`; transitive via alloy-sol-macro, no safe upgrade available (2026-06-08)
    "RUSTSEC-2026-0374", # Unmaintained `basic-toml` (2026-10-20)
    "RUSTSEC-2026-0387", # Non-constant-time ops in `crypto-bigint` 0.5.x; transitive via `k256` 0.13 (alloy), fixed only in >=0.7.6, no safe upgrade available (2026-10-23)
    # `zstd` 0.13.3 stream context leak; transitive via pinned `provekit-common` 1.0.2
    # (`zstd ^0.13`), the fix requires zstd 0.14.3 (2026-10-27)
    "RUSTSEC-2026-0391",
    # `zstd-safe` 7.2.4 seekable decompress; transitive via pinned `provekit-common` 1.0.2
    # (`zstd ^0.13` caps `zstd-safe ^7`), the fix requires zstd-safe 8.2.0 (2026-10-27)
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403", # `zstd-safe` 7.2.4 legacy-frame streaming; same cap as RUSTSEC-2026-0398 (2026-10-27)
]
