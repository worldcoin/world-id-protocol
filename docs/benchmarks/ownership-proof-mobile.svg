<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ownership proof mobile benchmark medians</title>
  <desc id="desc">Median witness generation, proving, and combined ownership proof times across three Android and three iOS devices, with 30 samples per fixture.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5f6368; }
    .panel { font-size: 20px; font-weight: 650; }
    .device { font-size: 13px; font-weight: 600; }
    .value { font-size: 11px; fill: #3c4043; }
    .axis { stroke: #dadce0; stroke-width: 1; }
    .tick { font-size: 11px; fill: #80868b; }
    .legend { font-size: 12px; }
  </style>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">Ownership proof mobile benchmark</text>
  <text x="48" y="75" class="subtitle">Median wall time · fixed 4-thread Rayon pool · 30 measured runs · 5 warmups · lower is better</text>

  <rect x="48" y="96" width="12" height="12" rx="2" fill="#4285f4"/>
  <text x="67" y="107" class="legend">Witness generation</text>
  <rect x="210" y="96" width="12" height="12" rx="2" fill="#f9ab00"/>
  <text x="229" y="107" class="legend">Proving</text>
  <rect x="304" y="96" width="12" height="12" rx="2" fill="#34a853"/>
  <text x="323" y="107" class="legend">Combined</text>

  <!-- Android panel: 180 px = 1000 ms -->
  <text x="48" y="154" class="panel">Android</text>
  <text x="48" y="181" class="device">Moto G71 5G · Android 11</text>
  <rect x="48" y="194" width="236.8" height="15" rx="3" fill="#4285f4"/>
  <text x="292" y="206" class="value">1315.56 ms</text>
  <rect x="48" y="215" width="145.5" height="15" rx="3" fill="#f9ab00"/>
  <text x="201" y="227" class="value">808.33 ms</text>
  <rect x="48" y="236" width="397.1" height="15" rx="3" fill="#34a853"/>
  <text x="452" y="248" class="value">2206.00 ms</text>

  <text x="48" y="286" class="device">Pixel 7 · Android 13</text>
  <rect x="48" y="299" width="163.1" height="15" rx="3" fill="#4285f4"/>
  <text x="218" y="311" class="value">906.00 ms</text>
  <rect x="48" y="320" width="125.2" height="15" rx="3" fill="#f9ab00"/>
  <text x="180" y="332" class="value">695.35 ms</text>
  <rect x="48" y="341" width="274.4" height="15" rx="3" fill="#34a853"/>
  <text x="329" y="353" class="value">1524.67 ms</text>

  <text x="48" y="391" class="device">Galaxy S24 · Android 14</text>
  <rect x="48" y="404" width="19.7" height="15" rx="3" fill="#4285f4"/>
  <text x="74" y="416" class="value">109.46 ms</text>
  <rect x="48" y="425" width="89.8" height="15" rx="3" fill="#f9ab00"/>
  <text x="145" y="437" class="value">498.63 ms</text>
  <rect x="48" y="446" width="112.1" height="15" rx="3" fill="#34a853"/>
  <text x="167" y="458" class="value">623.03 ms</text>

  <line x1="48" y1="490" x2="498" y2="490" class="axis"/>
  <line x1="48" y1="486" x2="48" y2="494" class="axis"/>
  <line x1="228" y1="486" x2="228" y2="494" class="axis"/>
  <line x1="408" y1="486" x2="408" y2="494" class="axis"/>
  <line x1="498" y1="486" x2="498" y2="494" class="axis"/>
  <text x="48" y="512" class="tick" text-anchor="middle">0</text>
  <text x="228" y="512" class="tick" text-anchor="middle">1000</text>
  <text x="408" y="512" class="tick" text-anchor="middle">2000</text>
  <text x="498" y="512" class="tick" text-anchor="middle">2500 ms</text>

  <!-- iOS panel: 100 px = 100 ms -->
  <text x="648" y="154" class="panel">iOS</text>
  <text x="648" y="181" class="device">iPhone SE 2022 · iOS 15</text>
  <rect x="648" y="194" width="122.6" height="15" rx="3" fill="#4285f4"/>
  <text x="778" y="206" class="value">122.56 ms</text>
  <rect x="648" y="215" width="161.6" height="15" rx="3" fill="#f9ab00"/>
  <text x="817" y="227" class="value">161.61 ms</text>
  <rect x="648" y="236" width="285.6" height="15" rx="3" fill="#34a853"/>
  <text x="941" y="248" class="value">285.58 ms</text>

  <text x="648" y="286" class="device">iPhone 14 · iOS 16</text>
  <rect x="648" y="299" width="237.4" height="15" rx="3" fill="#4285f4"/>
  <text x="892" y="311" class="value">237.43 ms</text>
  <rect x="648" y="320" width="162.8" height="15" rx="3" fill="#f9ab00"/>
  <text x="818" y="332" class="value">162.78 ms</text>
  <rect x="648" y="341" width="404.7" height="15" rx="3" fill="#34a853"/>
  <text x="1060" y="353" class="value">404.71 ms</text>

  <text x="648" y="391" class="device">iPhone 16 Pro · iOS 18</text>
  <rect x="648" y="404" width="62.9" height="15" rx="3" fill="#4285f4"/>
  <text x="718" y="416" class="value">62.93 ms</text>
  <rect x="648" y="425" width="110.0" height="15" rx="3" fill="#f9ab00"/>
  <text x="765" y="437" class="value">110.02 ms</text>
  <rect x="648" y="446" width="176.7" height="15" rx="3" fill="#34a853"/>
  <text x="832" y="458" class="value">176.71 ms</text>

  <line x1="648" y1="490" x2="1103" y2="490" class="axis"/>
  <line x1="648" y1="486" x2="648" y2="494" class="axis"/>
  <line x1="748" y1="486" x2="748" y2="494" class="axis"/>
  <line x1="848" y1="486" x2="848" y2="494" class="axis"/>
  <line x1="948" y1="486" x2="948" y2="494" class="axis"/>
  <line x1="1048" y1="486" x2="1048" y2="494" class="axis"/>
  <line x1="1098" y1="486" x2="1098" y2="494" class="axis"/>
  <text x="648" y="512" class="tick" text-anchor="middle">0</text>
  <text x="748" y="512" class="tick" text-anchor="middle">100</text>
  <text x="848" y="512" class="tick" text-anchor="middle">200</text>
  <text x="948" y="512" class="tick" text-anchor="middle">300</text>
  <text x="1048" y="512" class="tick" text-anchor="middle">400</text>
  <text x="1098" y="512" class="tick" text-anchor="middle">450 ms</text>

  <rect x="48" y="552" width="1104" height="146" rx="10" fill="#f8f9fa" stroke="#e8eaed"/>
  <text x="72" y="584" class="panel">Timing boundaries</text>
  <text x="72" y="616" class="subtitle">Witness generation: ProveKit ACIR witness generation from a prebuilt deterministic InputMap.</text>
  <text x="72" y="644" class="subtitle">Proving: ProveKit proof generation from a precomputed ACIR witness.</text>
  <text x="72" y="672" class="subtitle">Combined: witness generation followed by proving; fixture construction and prover loading are untimed.</text>
  <text x="48" y="732" class="subtitle">Source: Mobench 0.2.0 BrowserStack runs at commit 02ad53dd92e3271daaa4a0558615284dbf25f2ea</text>
</svg>
