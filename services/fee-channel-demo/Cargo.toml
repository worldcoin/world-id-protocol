[package]
name = "world-id-fee-channel-demo"
description = "Local end-to-end demo of a YABS fee channel: RP, nonce manager, and collector."
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { workspace = true, features = [
  "contract",
  "json",
  "network",
  "provider-anvil-api",
  "reqwest",
  "rpc",
  "rpc-types",
  "signer-local",
  "signers",
  "sol-types",
] }
alloy-node-bindings = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }
world-id-fee-escrow = { workspace = true }
world-id-primitives = { workspace = true }
