[package]
name = "world-id-proof"
description = "World ID Proof crate"
publish = true
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true
include = ["src/**/*", "noir/**/*", "build.rs", "Cargo.toml", "README.md"]

[features]
default = ["prover"]

# Proof generation and verification. Without it only `authenticator_assertion` is built, e.g. for
# an Authenticator Provider that issues AATs.
prover = [
  "dep:ark-babyjubjub",
  "dep:ark-bn254",
  "dep:ark-ec",
  "dep:ark-ff",
  "dep:ark-groth16",
  "dep:eyre",
  "dep:groth16-material",
  "dep:once_cell",
  "dep:provekit-common",
  "dep:provekit-prover",
  "dep:provekit-verifier",
  "dep:rand",
  "dep:ruint",
  "dep:taceo-groth16-sol",
  "dep:taceo-oprf",
  "dep:tracing",
  "dep:zeroize",
]

# Embed Circom zkeys (query + nullifier proof material) into the binary
embed-zkeys = ["prover", "dep:tar"]
# Compress the embedded zkeys to reduce binary size (ARK point compression)
compress-zkeys = ["embed-zkeys", "dep:ark-serialize", "dep:circom-types"]
# Compress the tar archive with zstd
zstd-compress-zkeys = ["embed-zkeys", "dep:zstd"]

embed-ownership-prover = ["prover", "dep:provekit-r1cs-compiler"]
embed-ownership-verifier = ["prover", "dep:provekit-r1cs-compiler"]
embed-noir-artifacts = ["embed-ownership-prover", "embed-ownership-verifier"]

# Embed everything
embed-zk-artifacts = ["embed-zkeys", "embed-noir-artifacts"]

[dependencies]
ark-babyjubjub = { workspace = true, optional = true }
ark-bn254 = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
ark-ec = { workspace = true, optional = true }
ark-groth16 = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
circom-types = { workspace = true, features = [
 "bn254",
 "groth16",
 "zkey",
], optional = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
eddsa-babyjubjub = { workspace = true }
provekit-common = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true }
groth16-material = { workspace = true, optional = true, features = ["circom"] }
ruint = { workspace = true, optional = true, features = ["ark-ff-06"] }
taceo-groth16-sol = { workspace = true, optional = true }
taceo-oprf = { workspace = true, optional = true, features = ["client", "core"] }
eyre = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# Internal
world-id-primitives = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
provekit-prover = { workspace = true, optional = true }
provekit-verifier = { workspace = true, optional = true }

[build-dependencies]
eyre = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
ark-serialize = { workspace = true }
circom-types = { workspace = true, features = ["bn254", "groth16", "zkey"] }
rayon = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
provekit-common = { workspace = true }
provekit-r1cs-compiler = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
test-case = { workspace = true }
toml = { workspace = true }
world-id-test-utils = { workspace = true }
