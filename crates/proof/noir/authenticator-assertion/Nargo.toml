[package]
name = "authenticator_assertion"
type = "lib"
descrption = "UNAUDITED. IN ACTIVE DEVELOPMENT, DO NOT USE YET. Library to support WIP-106 authenticator assertions."
authors = ["@paolodamico", "@kilianglas"]
license = "MIT"
backend = "provekit"

[dependencies]
# Pinned to the nargo 1.0.0-beta.26 generation, matching ownership-proof and the published provekit crates.
poseidon2 = { tag = "v0.8.0", git = "https://github.com/TaceoLabs/noir-poseidon", directory = "poseidon2" }
eddsa_poseidon2 = { tag = "v0.8.0", git = "https://github.com/TaceoLabs/noir-poseidon", directory = "eddsa_poseidon2" }
bignum = { tag = "v0.10.0-1", git = "https://github.com/zkpassport/noir-bignum" }
bigcurve = { tag = "v0.14.0-1", git = "https://github.com/zkpassport/noir_bigcurve" }
noir_ecdsa = { tag = "v0.4.1", git = "https://github.com/zkpassport/noir-ecdsa" }
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
