[package]
name = "passkey_ownership_proof"
type = "bin"
description = "UNAUDITED demo circuit proving WebAuthn passkey ownership and World ID registry inclusion."
authors = ["World Foundation"]
license = "MIT"
backend = "provekit"

[dependencies]
poseidon2 = { tag = "v0.8.0", git = "https://github.com/TaceoLabs/noir-poseidon", directory = "poseidon2" }
bignum = { tag = "v0.10.0", git = "https://github.com/noir-lang/noir-bignum" }
bigcurve = { tag = "v0.14.0", git = "https://github.com/noir-lang/noir_bigcurve" }
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
