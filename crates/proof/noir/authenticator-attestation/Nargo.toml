[package]
name = "authenticator_attestation"
type = "lib"
descrption = "UNAUDITED. ALPHA. Library to support WIP-106 authenticator attestations."
authors = ["@paolodamico"]
license = "MIT"
backend = "provekit"

[dependencies]
poseidon2 = { tag = "v0.6.1", git = "https://github.com/TaceoLabs/noir-poseidon", directory = "poseidon2" }
babyjubjub = { tag = "v2.0.0", git = "https://github.com/TaceoLabs/oprf-nr", directory = "babyjubjub" }
bignum = { tag = "v0.10.0-1", git = "https://github.com/zkpassport/noir-bignum" }
bigcurve = { tag = "v0.14.0-1", git = "https://github.com/zkpassport/noir_bigcurve" }
noir_ecdsa = { tag = "v0.4.1", git = "https://github.com/zkpassport/noir-ecdsa" }
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
