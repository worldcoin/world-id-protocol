[package]
name = "world-id-primitives"
description = "Contains the raw base primitives (without implementations) for the World ID Protocol."
publish = true
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["protocol"]
# Proof requests, OPRF, proofs and signers. Without it only the core types build (`FieldElement`,
# Poseidon, credentials, `authenticator_assertion`), e.g. for an Authenticator Provider.
protocol = [
  "dep:alloy",
  "dep:ark-bn254",
  "dep:ark-serde-compat",
  "dep:circom-types",
  "dep:provekit-common",
  "dep:secrecy",
  "dep:sha2",
  "dep:taceo-oprf",
  "dep:uuid",
]
# Enable OpenAPI schema derives for API types.
openapi = ["dep:utoipa"]

[dependencies]
ciborium = { workspace = true }
alloy = { workspace = true, optional = true, features = ["sol-types", "signer-local"] }
alloy-primitives = { workspace = true, default-features = false, features = [
    "serde",
    "std",
] }
ark-babyjubjub = { workspace = true }
ark-bn254 = { workspace = true, optional = true }
ark-ff = { workspace = true }
ark-serde-compat = { workspace = true, optional = true }
arrayvec = { workspace = true, features = ["serde"] }
circom-types = { workspace = true, optional = true, features = ["groth16", "proof", "bn254"] }
eddsa-babyjubjub = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
taceo-oprf = { workspace = true, optional = true, features = ["types"] }
ruint = { workspace = true, features = ["ark-ff-06"] }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true, features = ["serde"] }
percent-encoding = { workspace = true }
poseidon2 = { workspace = true }
provekit-common = { workspace = true, optional = true }
sha3 = { workspace = true, default-features = false }
rand = { workspace = true }
secrecy = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["js"] }
sha2 = { workspace = true, optional = true }
embed-doc-image = "0.1.4"

# WASM support: getrandom needs 'wasm_js' feature in browsers
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom-04 = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
cbor-diag = { workspace = true }
test-case = { workspace = true }
ark-ec = { workspace = true }
ark-serialize = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
taceo-oprf = { workspace = true, features = ["core", "types"] }
