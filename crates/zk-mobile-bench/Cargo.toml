[package]
name = "zk-mobile-bench"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Mobile benchmarks for World ID ZK proof generation"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Benchmarking
mobench-sdk = "0.2.0"
inventory = "0.3"

# World ID
world-id-core = { workspace = true, default-features = false, features = ["authenticator", "embed-zkeys", "issuer"] }
world-id-primitives = { workspace = true }
world-id-proof = { workspace = true, features = ["embed-attestation-prover"] }

# ZK dependencies
ark-babyjubjub = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-ec = { workspace = true }
eddsa-babyjubjub = { workspace = true }
groth16-material = { workspace = true, features = ["circom"] }
provekit-prover = { workspace = true }

# WIP-106 token building for the attestation benchmark fixture
coset = { workspace = true }
p256 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OPRF dependencies
taceo-oprf = { workspace = true }

# Utilities
rand = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }

# UniFFI for mobile bindings
uniffi = { version = "0.32", features = ["cli"] }
