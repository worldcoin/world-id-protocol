[package]
name = "world-id-billing-follower"
description = "Follows the WIP-107 Billing Contract and emits the billing state a TEE Verifier's host supplies"
publish = true
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { workspace = true, features = [
  "eips",
  "network",
  "providers",
  "provider-http",
  "reqwest",
  "reqwest-rustls-tls",
  "rpc-client",
  "rpc-types-eth",
  "sol-types",
  "transports",
] }
metrics = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }
# Core types only: the follower needs the billing state and period math, not proofs or OPRF.
world-id-primitives = { version = "0.21.0", path = "../primitives", default-features = false }
world-id-registries = { workspace = true }

[dev-dependencies]
alloy = { workspace = true, features = ["node-bindings", "signer-local", "contract"] }
eyre = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
world-id-test-utils = { workspace = true }
