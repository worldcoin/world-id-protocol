name: Release Crates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-crates:
    name: Release Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch https://github.com/dtolnay/rust-toolchain/commit/6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install Noir toolchain
        env:
          # Keep the version and archive digest in sync with nix/nargo.nix.
          NARGO_VERSION: 1.0.0-beta.26
          NARGO_SHA256: 64048040befd55a987158b11137d8f38f9688f696db4d84910dd1bcf0442fb80
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d "$RUNNER_TEMP/nargo.XXXXXX")
          cd "$install_dir"
          base_url="https://github.com/noir-lang/noir/releases/download"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base_url/v${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz" \
            --output nargo.tar.gz
          echo "$NARGO_SHA256  nargo.tar.gz" | sha256sum --check --strict
          tar -xzf nargo.tar.gz nargo
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139 (https://github.com/release-plz/action/releases/tag/v0.5.139)
        env:
          # Override rust-toolchain.toml, including in release-plz's temporary workspaces.
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
