name: Noir CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  noir:
    # Keeps the per-package check names, e.g. "Noir CI (ownership-proof)".
    name: Noir CI (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ownership-proof
            execute: true
          - package: world-id-components
            execute: false
          - package: authenticator-assertion
            execute: false
    defaults:
      run:
        working-directory: ./crates/proof/noir/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4 https://github.com/noir-lang/noirup/releases/tag/v0.1.4
        with:
          # See https://github.com/worldfnd/provekit, a specific nargo toolchain version is required
          toolchain: v1.0.0-beta.26
      - run: nargo fmt --check && nargo test
      # Only binary packages have a `Prover.toml` to execute.
      - if: matrix.execute
        run: nargo execute
