on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - contracts/**/*
      - crates/registries/abi/**/*
      - crates/issuer/abi/**/*

permissions:
  contents: read

name: Contracts CI

env:
  FOUNDRY_PROFILE: ci
  WORLDCHAIN_PROVIDER: "${{ secrets.WORLDCHAIN_PROVIDER }}"
  ETHEREUM_PROVIDER: "${{ secrets.ETHEREUM_PROVIDER }}"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1 https://github.com/foundry-rs/foundry-toolchain/releases/tag/v1.9.1
        with:
          version: 1.7.1

      - name: Cache Forge dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 https://github.com/actions/cache/releases/tag/v4.3.0
        with:
          path: contracts/lib
          key: ${{ runner.os }}-forge-${{ hashFiles('contracts/foundry.lock', 'contracts/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-forge-

      - name: Install dependencies
        run: forge install

      - name: Run tests
        run: forge test -vvv

      - name: Check formatting
        run: forge fmt --check

  check-abis:
    name: Check ABIs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1 https://github.com/foundry-rs/foundry-toolchain/releases/tag/v1.9.1
        with:
          version: 1.7.1

      - name: Cache Forge dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 https://github.com/actions/cache/releases/tag/v4.3.0
        with:
          path: contracts/lib
          key: ${{ runner.os }}-forge-${{ hashFiles('contracts/foundry.lock', 'contracts/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-forge-

      - name: Regenerate ABIs
        run: make sol-build

      - name: Check for ABI changes
        run: |
          if ! git diff --exit-code crates/registries/abi/ crates/issuer/abi/; then
            echo "::error::ABI files are out of sync with contracts. Run 'make sol-build' and commit the changes."
            exit 1
          fi
