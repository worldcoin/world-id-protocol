name: Publish mdBook

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "book.toml"
      - "docs/**"
      - "flake.lock"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23 https://github.com/DeterminateSystems/nix-installer-action/releases/tag/v23

      - name: Build documentation
        run: |
          nix develop .#docs --command mdbook build
          touch book/.nojekyll

      - name: Publish documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4 https://github.com/peaceiris/actions-gh-pages/releases/tag/v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./book
          force_orphan: true
