name: Passkey Demo CI

on:
  pull_request:
    paths:
      - "apps/passkey-demo/**"
      - "crates/proof/noir/passkey-ownership-proof/**"
      - "artifacts/passkey-artifacts.sha256"
      - "scripts/passkey-artifacts.sh"
      - ".github/workflows/passkey-demo-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/passkey-demo/**"
      - "crates/proof/noir/passkey-ownership-proof/**"
      - "artifacts/passkey-artifacts.sha256"
      - "scripts/passkey-artifacts.sh"
      - ".github/workflows/passkey-demo-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/passkey-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/passkey-artifacts.sh verify
        working-directory: .
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
