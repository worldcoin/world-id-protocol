# Builds the Docker images for the services and pushes them to the GitHub Container Registry attested
name: Build Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "world-id-indexer-v*"
      - "world-id-gateway-v*"
      - "world-id-relay-v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      service:
        description: "Service to build (e.g. oprf-node)"
        required: true
        type: string
      version:
        description: "Version tag including v prefix (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compute-matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Determine services to build
        id: filter
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_SERVICE: ${{ inputs.service }}
        run: |
          if [[ -n "$INPUT_SERVICE" ]]; then
            echo "services=[\"$INPUT_SERVICE\"]" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == "branch" ]]; then
            echo 'services=["indexer","gateway","relay"]' >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == world-id-indexer-v* ]]; then
            echo 'services=["indexer"]' >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == world-id-gateway-v* ]]; then
            echo 'services=["gateway"]' >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == world-id-relay-v* ]]; then
            echo 'services=["relay"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          fi
  docker-build:
    name: Docker Build
    needs: compute-matrix
    if: needs.compute-matrix.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.compute-matrix.outputs.services) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: tag
        if: github.ref_type == 'tag' || inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#world-id-${{ matrix.service }}-}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # latest only for stable releases (no pre-release suffix like -alpha, -rc.1)
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4.6.0 https://github.com/docker/metadata-action/releases/tag/v4.6.0
        with:
          images: ghcr.io/${{ github.repository }}/world-id-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/main' && inputs.version == '') || steps.tag.outputs.is_stable == 'true' }}
            type=sha
            type=raw,value=${{ steps.tag.outputs.version }},enable=${{ steps.tag.outputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 https://github.com/docker/setup-buildx-action/releases/tag/v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 https://github.com/docker/build-push-action/releases/tag/v6.19.2
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: "type=gha,mode=max"
          platforms: linux/amd64
          build-args: |
            SERVICE_NAME=world-id-${{ matrix.service }}
            GIT_HASH=${{ github.sha }}

      - name: Attest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4 https://github.com/actions/attest-build-provenance/releases/tag/v1.4.4
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository }}/world-id-${{ matrix.service }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}

      - name: Trigger staging deploy
        if: (github.ref_type == 'tag' || inputs.version != '') && matrix.service != 'oprf-node'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ steps.tag.outputs.version }}
        with:
          github-token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'worldcoin',
              repo: 'world-id-protocol-deploy',
              event_type: 'service-release',
              client_payload: {
                service: process.env.SERVICE,
                version: process.env.VERSION
              }
            });
