name: Reusable Mobile Benchmark (BrowserStack)

on:
  workflow_call:
    inputs:
      crate_path:
        description: "Path to the benchmark crate in the caller repo"
        required: true
        type: string
      functions:
        description: "Comma-separated or JSON array list of benchmark function names to run"
        required: true
        type: string
      iterations:
        description: "Number of benchmark iterations"
        required: false
        type: string
        default: "30"
      warmup:
        description: "Number of warmup iterations"
        required: false
        type: string
        default: "5"
      fetch_timeout_secs:
        description: "Seconds to wait for each BrowserStack run to complete"
        required: false
        type: string
        default: "1800"
      ios_completion_timeout_secs:
        description: "Seconds before the generated iOS XCUITest harness times out"
        required: false
        type: string
        default: "1800"
      platform:
        description: "Target platform: android, ios, or both"
        required: false
        type: string
        default: "both"
      device_profile:
        description: "Device profile tag resolved against the caller's device-matrix.yaml (e.g. low-spec, mid-spec, high-spec, all)"
        required: false
        type: string
        default: "low-spec"
      ios_device:
        description: "Custom iOS device name (required when device_profile=custom)"
        required: false
        type: string
      ios_os_version:
        description: "Custom iOS OS version (required when device_profile=custom)"
        required: false
        type: string
      android_device:
        description: "Custom Android device name (required when device_profile=custom)"
        required: false
        type: string
      android_os_version:
        description: "Custom Android OS version (required when device_profile=custom)"
        required: false
        type: string
      rust_targets_ios:
        description: "Comma-separated iOS Rust targets"
        required: false
        type: string
        default: "aarch64-apple-ios,aarch64-apple-ios-sim"
      rust_targets_android:
        description: "Comma-separated Android Rust targets"
        required: false
        type: string
        default: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"
      build_release:
        description: "Build in release mode"
        required: false
        type: boolean
        default: true
      mobench_version:
        description: "Mobench version to install"
        required: false
        type: string
        default: "0.1.40"
      mobench_ref:
        description: "Git ref for mobile-bench-rs (overrides crates.io mobench_version when set)"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number for sticky reporting (used by /mobench and bench-label runs)"
        required: false
        type: string
      open_results_pr:
        description: "If true, open a PR that refreshes checked-in results under crates/zk-mobile-bench/results/ (main tip only; requires empty pr_number)"
        required: false
        type: boolean
        default: false
      requested_by:
        description: "Who triggered the run"
        required: false
        type: string
      head_sha:
        description: "Exact commit SHA to checkout in the caller repo (for compile-gated runs)"
        required: false
        type: string
    secrets:
      BROWSERSTACK_USERNAME:
        required: true
      BROWSERSTACK_ACCESS_KEY:
        required: true

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS BrowserStack benchmark
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15

    outputs:
      bench_outcome: ${{ steps.run_ios_benchmarks.outcome }}

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      RUSTUP_TOOLCHAIN: stable
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
      CFLAGS_aarch64_apple_ios: "-miphoneos-version-min=13.0"
      CFLAGS_aarch64_apple_ios_sim: "-mios-simulator-version-min=13.0"
      CFLAGS_x86_64_apple_ios: "-mios-simulator-version-min=13.0"
      CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS: "-C link-arg=-miphoneos-version-min=13.0"
      CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUSTFLAGS: "-C link-arg=-mios-simulator-version-min=13.0"
      CARGO_TARGET_X86_64_APPLE_IOS_RUSTFLAGS: "-C link-arg=-mios-simulator-version-min=13.0"

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          path: caller
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch https://github.com/dtolnay/rust-toolchain/commit/6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ inputs.rust_targets_ios }}

      - name: Ensure iOS Rust targets
        shell: bash
        run: |
          rustup +stable target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup +stable component add rust-std --target aarch64-apple-ios
          rustup +stable component add rust-std --target aarch64-apple-ios-sim
          rustup +stable target list --installed | grep -E "ios|apple"

      - uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4 https://github.com/noir-lang/noirup/releases/tag/v0.1.4
        with:
          # See https://github.com/worldfnd/provekit, a specific nargo toolchain version is required
          toolchain: v1.0.0-beta.11

      - name: Cache cargo registry/git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('caller/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: caller/target
          key: ${{ runner.os }}-target-ios-${{ hashFiles('caller/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-ios-

      - name: Install mobench
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [ -n "${MOBENCH_REF:-}" ]; then
            echo "Installing mobench from Git ref: ${MOBENCH_REF}"
            git clone https://github.com/worldcoin/mobile-bench-rs mobench-src
            git -C mobench-src checkout "$MOBENCH_REF"
          else
            echo "Installing mobench ${MOBENCH_VERSION} from cargo registry"
            cargo info "mobench@${MOBENCH_VERSION}" >/dev/null
            REG_SRC=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name "mobench-${MOBENCH_VERSION}" | head -n 1)
            if [ -z "${REG_SRC}" ]; then
              echo "::error::Unable to locate mobench ${MOBENCH_VERSION} in cargo registry source cache"
              exit 1
            fi
            mkdir -p mobench-src/crates
            cp -R "${REG_SRC}" mobench-src/crates/mobench
            git -C mobench-src init -q
          fi
          cargo install --path mobench-src/crates/mobench --locked

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve iOS devices
        id: resolve_device
        working-directory: caller
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile }}
          IOS_DEVICE_OVERRIDE: ${{ inputs.ios_device }}
          IOS_OS_VERSION_OVERRIDE: ${{ inputs.ios_os_version }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          if [ -n "$IOS_DEVICE_OVERRIDE" ] && [ -n "$IOS_OS_VERSION_OVERRIDE" ]; then
            specs="${IOS_DEVICE_OVERRIDE}-${IOS_OS_VERSION_OVERRIDE}"
            echo "Using custom device: ${specs}"
          else
            # Profiles (including `all`) are tags in the repo-owned device matrix,
            # which also encodes the BrowserStack-inventory workarounds.
            output=$(cargo-mobench devices resolve \
              --platform ios \
              --profile "${DEVICE_PROFILE}" \
              --device-matrix "${CRATE_PATH}/device-matrix.yaml" \
              --format json 2>&1) || {
                echo "::error::Failed to resolve iOS devices: $output"
                exit 1
              }
            specs=$(jq -r '.devices[].identifier' <<<"$output")
            if [ -z "${specs}" ]; then
              echo "::error::Profile ${DEVICE_PROFILE} resolved to no iOS devices"
              exit 1
            fi
            echo "Resolved iOS devices:"
            echo "${specs}"
          fi
          {
            echo "device_specs<<SPECS_EOF"
            echo "${specs}"
            echo "SPECS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Debug target sysroot
        shell: bash
        run: |
          echo "=== Active toolchain ==="
          rustup show active-toolchain
          echo "=== Sysroot ==="
          SYSROOT=$(rustc --print sysroot)
          echo "$SYSROOT"
          echo "=== iOS target libs ==="
          ls "$SYSROOT/lib/rustlib/aarch64-apple-ios/lib/" 2>&1 | head -5 || echo "MISSING"
          echo "=== which cargo-mobench ==="
          which cargo-mobench
          echo "=== mobench version ==="
          cargo-mobench --version

      - name: Build iOS artifacts
        working-directory: caller
        shell: bash
        env:
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          cargo-mobench build --target ios $RELEASE_FLAG --crate-path "$CRATE_PATH"
          cargo-mobench package-ipa --method adhoc --crate-path "$CRATE_PATH"
          cargo-mobench package-xcuitest --crate-path "$CRATE_PATH"
          test -f target/mobench/ios/BenchRunner.ipa
          test -f target/mobench/ios/BenchRunnerUITests.zip

      - name: Run iOS benchmarks
        id: run_ios_benchmarks
        working-directory: caller
        shell: bash
        env:
          FUNCTIONS: ${{ inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          FETCH_TIMEOUT_SECS: ${{ inputs.fetch_timeout_secs }}
          IOS_COMPLETION_TIMEOUT_SECS: ${{ inputs.ios_completion_timeout_secs }}
          DEVICE_SPECS: ${{ steps.resolve_device.outputs.device_specs }}
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          device_args=()
          while IFS= read -r spec; do
            [ -n "${spec}" ] && device_args+=(--devices "${spec}")
          done <<<"${DEVICE_SPECS}"
          functions_arg="${FUNCTIONS}"
          if [[ "${FUNCTIONS}" == \[* ]]; then
            functions_arg=$(jq -r 'join(",")' <<<"${FUNCTIONS}")
          fi
          echo "Running iOS benchmarks on:"
          echo "${DEVICE_SPECS}"
          echo "Resolved functions: ${functions_arg}"

          cargo-mobench ci run \
            --target ios \
            --functions "${functions_arg}" \
            --iterations "${ITERATIONS}" \
            --warmup "${WARMUP}" \
            "${device_args[@]}" \
            --crate-path "$CRATE_PATH" \
            $RELEASE_FLAG \
            --ios-completion-timeout-secs "${IOS_COMPLETION_TIMEOUT_SECS}" \
            --fetch \
            --fetch-timeout-secs "${FETCH_TIMEOUT_SECS}" \
            --output-dir target/mobench/ci/ios

      - name: Validate iOS benchmark outputs
        if: always()
        working-directory: caller
        shell: bash
        env:
          BENCH_OUTCOME: ${{ steps.run_ios_benchmarks.outcome }}
        run: |
          set -euo pipefail
          json_count=$(find target/mobench/ci/ios/ios -type f -name summary.json 2>/dev/null | wc -l | tr -d ' ')
          csv_count=$(find target/mobench/ci/ios/ios -type f -name results.csv 2>/dev/null | wc -l | tr -d ' ')

          if [ "$json_count" -eq 0 ] || [ "$csv_count" -eq 0 ]; then
            echo "::error::iOS benchmark artifacts were not produced"
            exit 1
          fi

          echo "Found ${json_count} iOS summary JSON files and ${csv_count} CSV files"

          if [ "$BENCH_OUTCOME" != "success" ]; then
            echo "::warning::iOS benchmark command exited non-zero after producing artifacts"
          fi

      - name: Upload iOS results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: mobench-results-ios
          path: |
            caller/target/mobench/ci/ios/**
            caller/target/browserstack/**
          if-no-files-found: warn

  android:
    name: Android BrowserStack benchmark
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: macos-14

    outputs:
      bench_outcome: ${{ steps.run_android_benchmarks.outcome }}

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          path: caller
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch https://github.com/dtolnay/rust-toolchain/commit/6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ inputs.rust_targets_android }}

      - name: Ensure Android Rust targets
        shell: bash
        run: |
          rustup +stable target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustup +stable component add rust-std --target aarch64-linux-android
          rustup +stable component add rust-std --target armv7-linux-androideabi
          rustup +stable component add rust-std --target x86_64-linux-android
          rustup +stable target list --installed | grep -E "android"

      - name: Cache cargo registry/git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('caller/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: caller/target
          key: ${{ runner.os }}-target-android-${{ hashFiles('caller/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-android-

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2 https://github.com/android-actions/setup-android/releases/tag/v3.2.2

      - name: Install SDK packages and resolve NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"

          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(command -v sdkmanager 2>/dev/null || echo "sdkmanager")
          fi
          echo "Using sdkmanager: $SDKMGR"

          $SDKMGR --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 || true

          echo "Available NDKs:"
          ls "${ANDROID_HOME}/ndk/" 2>/dev/null || echo "  (none)"

          if [ -d "${ANDROID_HOME}/ndk/26.1.10909125" ]; then
            NDK_DIR="${ANDROID_HOME}/ndk/26.1.10909125"
          else
            NDK_VER=$(ls "${ANDROID_HOME}/ndk/" 2>/dev/null | sort -V | tail -1)
            if [ -n "$NDK_VER" ]; then
              echo "::warning::NDK 26.1.10909125 not found, using ${NDK_VER}"
              NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VER}"
            else
              echo "::error::No Android NDK found"
              exit 1
            fi
          fi

          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "Resolved ANDROID_NDK_HOME=${NDK_DIR}"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4 https://github.com/noir-lang/noirup/releases/tag/v0.1.4
        with:
          # See https://github.com/worldfnd/provekit, a specific nargo toolchain version is required
          toolchain: v1.0.0-beta.11

      - name: Install mobench
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [ -n "${MOBENCH_REF:-}" ]; then
            echo "Installing mobench from Git ref: ${MOBENCH_REF}"
            git clone https://github.com/worldcoin/mobile-bench-rs mobench-src
            git -C mobench-src checkout "$MOBENCH_REF"
          else
            echo "Installing mobench ${MOBENCH_VERSION} from cargo registry"
            cargo info "mobench@${MOBENCH_VERSION}" >/dev/null
            REG_SRC=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name "mobench-${MOBENCH_VERSION}" | head -n 1)
            if [ -z "${REG_SRC}" ]; then
              echo "::error::Unable to locate mobench ${MOBENCH_VERSION} in cargo registry source cache"
              exit 1
            fi
            mkdir -p mobench-src/crates
            cp -R "${REG_SRC}" mobench-src/crates/mobench
            git -C mobench-src init -q
          fi
          cargo install --path mobench-src/crates/mobench --locked

      - name: Resolve Android devices
        id: resolve_device
        working-directory: caller
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile }}
          ANDROID_DEVICE_OVERRIDE: ${{ inputs.android_device }}
          ANDROID_OS_VERSION_OVERRIDE: ${{ inputs.android_os_version }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DEVICE_OVERRIDE" ] && [ -n "$ANDROID_OS_VERSION_OVERRIDE" ]; then
            specs="${ANDROID_DEVICE_OVERRIDE}-${ANDROID_OS_VERSION_OVERRIDE}"
            echo "Using custom device: ${specs}"
          else
            # Profiles (including `all`) are tags in the repo-owned device matrix,
            # which also encodes the BrowserStack-inventory workarounds.
            output=$(cargo-mobench devices resolve \
              --platform android \
              --profile "${DEVICE_PROFILE}" \
              --device-matrix "${CRATE_PATH}/device-matrix.yaml" \
              --format json 2>&1) || {
                echo "::error::Failed to resolve Android devices: $output"
                exit 1
              }
            specs=$(jq -r '.devices[].identifier' <<<"$output")
            if [ -z "${specs}" ]; then
              echo "::error::Profile ${DEVICE_PROFILE} resolved to no Android devices"
              exit 1
            fi
            echo "Resolved Android devices:"
            echo "${specs}"
          fi
          {
            echo "device_specs<<SPECS_EOF"
            echo "${specs}"
            echo "SPECS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Android artifacts
        working-directory: caller
        shell: bash
        env:
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          cargo-mobench build --target android $RELEASE_FLAG --crate-path "$CRATE_PATH"

      - name: Run Android benchmarks
        id: run_android_benchmarks
        working-directory: caller
        shell: bash
        env:
          FUNCTIONS: ${{ inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          FETCH_TIMEOUT_SECS: ${{ inputs.fetch_timeout_secs }}
          DEVICE_SPECS: ${{ steps.resolve_device.outputs.device_specs }}
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          device_args=()
          while IFS= read -r spec; do
            [ -n "${spec}" ] && device_args+=(--devices "${spec}")
          done <<<"${DEVICE_SPECS}"
          functions_arg="${FUNCTIONS}"
          if [[ "${FUNCTIONS}" == \[* ]]; then
            functions_arg=$(jq -r 'join(",")' <<<"${FUNCTIONS}")
          fi
          echo "Running Android benchmarks on:"
          echo "${DEVICE_SPECS}"
          echo "Resolved functions: ${functions_arg}"

          cargo-mobench ci run \
            --target android \
            --functions "${functions_arg}" \
            --iterations "${ITERATIONS}" \
            --warmup "${WARMUP}" \
            "${device_args[@]}" \
            --crate-path "$CRATE_PATH" \
            $RELEASE_FLAG \
            --fetch \
            --fetch-timeout-secs "${FETCH_TIMEOUT_SECS}" \
            --output-dir target/mobench/ci/android

      - name: Validate Android benchmark outputs
        if: always()
        working-directory: caller
        shell: bash
        env:
          BENCH_OUTCOME: ${{ steps.run_android_benchmarks.outcome }}
        run: |
          set -euo pipefail
          json_count=$(find target/mobench/ci/android/android -type f -name summary.json 2>/dev/null | wc -l | tr -d ' ')
          csv_count=$(find target/mobench/ci/android/android -type f -name results.csv 2>/dev/null | wc -l | tr -d ' ')

          if [ "$json_count" -eq 0 ] || [ "$csv_count" -eq 0 ]; then
            echo "::error::Android benchmark artifacts were not produced"
            exit 1
          fi

          echo "Found ${json_count} Android summary JSON files and ${csv_count} CSV files"

          if [ "$BENCH_OUTCOME" != "success" ]; then
            echo "::warning::Android benchmark command exited non-zero after producing artifacts"
          fi

      - name: Upload Android results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: mobench-results-android
          path: |
            caller/target/mobench/ci/android/**
            caller/target/browserstack/**
          if-no-files-found: warn

  summarize:
    name: Summarize benchmark results
    needs: [ios, android]
    if: always() && (needs.ios.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          path: caller
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch https://github.com/dtolnay/rust-toolchain/commit/6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install mobench
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [ -n "${MOBENCH_REF:-}" ]; then
            echo "Installing mobench from Git ref: ${MOBENCH_REF}"
            git clone https://github.com/worldcoin/mobile-bench-rs mobench-src
            git -C mobench-src checkout "$MOBENCH_REF"
          else
            echo "Installing mobench ${MOBENCH_VERSION} from cargo registry"
            cargo info "mobench@${MOBENCH_VERSION}" >/dev/null
            REG_SRC=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name "mobench-${MOBENCH_VERSION}" | head -n 1)
            if [ -z "${REG_SRC}" ]; then
              echo "::error::Unable to locate mobench ${MOBENCH_VERSION} in cargo registry source cache"
              exit 1
            fi
            mkdir -p mobench-src/crates
            cp -R "${REG_SRC}" mobench-src/crates/mobench
            git -C mobench-src init -q
          fi
          cargo install --path mobench-src/crates/mobench --locked

      - name: Download iOS results
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 https://github.com/actions/download-artifact/releases/tag/v4.3.0
        with:
          name: mobench-results-ios
          path: results/ios

      - name: Download Android results
        if: needs.android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 https://github.com/actions/download-artifact/releases/tag/v4.3.0
        with:
          name: mobench-results-android
          path: results/android

      - name: Setup Python for plot rendering
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 https://github.com/actions/setup-python/releases/tag/v5.6.0
        with:
          python-version: "3.11"

      - name: Install plot rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      - name: Render plot-capable platform summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          rendered_count=0

          render_platform_summary() {
            local platform="$1"
            local results_dir="results/${platform}"
            if [ ! -d "${results_dir}" ]; then
              return 0
            fi

            local summary_json
            summary_json=$(find "${results_dir}" -type f -path "*/mobench/ci/${platform}/summary.json" | head -1)
            if [ -z "${summary_json}" ]; then
              echo "::warning::No ${platform} summary.json found under ${results_dir}"
              return 0
            fi

            mkdir -p "rendered/${platform}"

            cargo-mobench ci summarize \
              --results-dir "${results_dir}" \
              --output-format table || true

            if cargo-mobench report summarize \
              --summary "${summary_json}" \
              --output "rendered/${platform}/summary.md" \
              --plots auto; then
              return 0
            fi

            echo "::warning::Falling back to markdown-only ${platform} summary after plot rendering failure."
            if cargo-mobench ci summarize \
              --results-dir "${results_dir}" \
              --output-format markdown \
              --output-file "rendered/${platform}/summary.md"; then
              return 0
            fi

            return 1
          }

          for platform in ios android; do
            if render_platform_summary "${platform}"; then
              if [ -f "rendered/${platform}/summary.md" ]; then
                rendered_count=$((rendered_count + 1))
              fi
            else
              echo "::warning::Unable to render ${platform} benchmark summary."
            fi
          done

          if [ "${rendered_count}" -eq 0 ]; then
            echo "::error::No benchmark summaries were rendered."
            exit 1
          fi

      - name: Publish plot assets
        id: publish_plots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASSET_BRANCH: mobench-plots
        run: |
          set -euo pipefail

          if ! find rendered -type f -path "*/plots/*.svg" | grep -q .; then
            echo "base_url=" >> "$GITHUB_OUTPUT"
            echo "No rendered plots found; skipping asset publish."
            exit 0
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          asset_path="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          publish_once() {
            local publish_root="$1"

            if git clone --quiet --branch "${ASSET_BRANCH}" "${remote}" "${publish_root}" 2>/dev/null; then
              :
            else
              git clone --quiet "${remote}" "${publish_root}"
              git -C "${publish_root}" checkout --orphan "${ASSET_BRANCH}"
              git -C "${publish_root}" rm -rf . >/dev/null 2>&1 || true
            fi

            git -C "${publish_root}" config user.name "github-actions[bot]"
            git -C "${publish_root}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p "${publish_root}/${asset_path}"

            for platform in ios android; do
              if [ -d "rendered/${platform}/plots" ]; then
                mkdir -p "${publish_root}/${asset_path}/${platform}"
                rm -rf "${publish_root}/${asset_path}/${platform}/plots"
                cp -R "rendered/${platform}/plots" "${publish_root}/${asset_path}/${platform}/plots"
              fi
            done

            git -C "${publish_root}" add "${asset_path}"
            if git -C "${publish_root}" diff --cached --quiet; then
              echo "No plot asset changes to publish."
              return 0
            fi

            if git -C "${publish_root}" commit -m "mobench plots for run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null \
              && git -C "${publish_root}" push origin "${ASSET_BRANCH}" >/dev/null; then
              return 0
            fi

            return 1
          }

          published=0
          for attempt in 1 2 3; do
            publish_root="$(mktemp -d)"
            if publish_once "${publish_root}"; then
              published=1
              break
            fi
            echo "::warning::Plot asset publish attempt ${attempt} failed; retrying with the latest branch state."
          done

          if [ "${published}" -ne 1 ]; then
            echo "::error::Unable to publish plot assets after 3 attempts."
            exit 1
          fi

          echo "base_url=https://raw.githubusercontent.com/${REPO}/${ASSET_BRANCH}/${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Rewrite platform summaries for GitHub markdown
        shell: bash
        env:
          PLOT_BASE_URL: ${{ steps.publish_plots.outputs.base_url }}
        run: |
          set -euo pipefail

          rewrite_platform_summary() {
            local platform="$1"
            local input="rendered/${platform}/summary.md"
            local output="rendered/${platform}/github-summary.md"
            if [ ! -f "${input}" ]; then
              return 0
            fi

            cp "${input}" "${output}"

            if [ -n "${PLOT_BASE_URL:-}" ] && [ -d "rendered/${platform}/plots" ]; then
              sed -i "s#](plots/#](${PLOT_BASE_URL}/${platform}/plots/#g" "${output}"
            fi
          }

          rewrite_platform_summary ios
          rewrite_platform_summary android

      - name: Summarize iOS results
        if: needs.ios.result == 'success'
        shell: bash
        run: |
          echo "## iOS Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f rendered/ios/github-summary.md ]; then
            cat rendered/ios/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No iOS benchmark summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Android results
        if: needs.android.result == 'success'
        shell: bash
        run: |
          echo "## Android Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f rendered/android/github-summary.md ]; then
            cat rendered/android/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Android benchmark summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- mobench-summary -->"

          BODY="${MARKER}
          ## Mobench Benchmark Results

          "
          for platform in ios android; do
            PLATFORM_MD_FILE="rendered/${platform}/github-summary.md"
            if [ -f "${PLATFORM_MD_FILE}" ]; then
              PLATFORM_MD=$(cat "${PLATFORM_MD_FILE}")
              BODY="${BODY}${PLATFORM_MD}

          "
            fi
          done

          BODY="${BODY}
          ---
          *Posted by [mobench](https://github.com/worldcoin/mobile-bench-rs) at $(date -u '+%Y-%m-%d %H:%M UTC')*"

          EXISTING_COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            2>/dev/null | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -X PATCH \
              -f body="${BODY}" \
              --silent
            echo "Updated existing PR comment #${EXISTING_COMMENT_ID}"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}" \
              --silent
            echo "Created new PR comment"
          fi

      - name: Build history bundle
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          mkdir -p history-bundle
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          cp results/ios/mobench/ci/ios/summary.json history-bundle/ios-summary.json 2>/dev/null || true
          cp results/ios/mobench/ci/ios/results.csv history-bundle/ios-results.csv 2>/dev/null || true
          cp rendered/ios/github-summary.md history-bundle/ios-summary.md 2>/dev/null || true
          cp results/android/mobench/ci/android/summary.json history-bundle/android-summary.json 2>/dev/null || true
          cp results/android/mobench/ci/android/results.csv history-bundle/android-results.csv 2>/dev/null || true
          cp rendered/android/github-summary.md history-bundle/android-summary.md 2>/dev/null || true

          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg sha "$HEAD_SHA" \
            --arg pr "${PR_NUMBER:-}" \
            --arg by "${REQUESTED_BY:-ci}" \
            --arg ver "mobench-history-v1" \
            '{
              schema_version: $ver,
              timestamp: $ts,
              commit_sha: $sha,
              pr_number: (if $pr != "" then ($pr | tonumber) else null end),
              requested_by: $by
            }' > history-bundle/manifest.json

      - name: Upload history bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: mobench-history-bundle
          path: history-bundle/
          if-no-files-found: warn

      - name: Open results refresh PR
        # Deliberately `||`: a half-successful run must reach the script and fail loudly, not skip silently.
        if: >-
          !cancelled()
          && inputs.open_results_pr
          && (needs.ios.result == 'success' || needs.android.result == 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          CRATE_PATH: ${{ inputs.crate_path }}
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          DEVICE_PROFILE: ${{ inputs.device_profile }}
          PLATFORM: ${{ inputs.platform }}
          IOS_BENCH_OUTCOME: ${{ needs.ios.outputs.bench_outcome }}
          ANDROID_BENCH_OUTCOME: ${{ needs.android.outputs.bench_outcome }}
        run: |
          set -euo pipefail

          # pr_number and the dispatched ref are validated in the caller's preflight job.
          # The benchmarked commit is recorded in meta.json rather than checked against the
          # tip: main may advance during the run, and the numbers remain valid for their SHA.
          default_branch="${DEFAULT_BRANCH:-main}"

          # The snapshot is one artifact: publishing a single platform would leave the other
          # platform's stale summary.json next to a meta.json claiming the new commit.
          if [ "${PLATFORM}" != "both" ]; then
            echo "::error::open_results_pr=true requires platform=both (got ${PLATFORM})."
            exit 1
          fi

          # The bench jobs tolerate a non-zero mobench exit as long as files landed, which is fine
          # for a throwaway PR comment but not for the canonical checked-in snapshot.
          if [ "${IOS_BENCH_OUTCOME}" != "success" ] || [ "${ANDROID_BENCH_OUTCOME}" != "success" ]; then
            echo "::error::Refusing to publish; benchmarks did not exit cleanly (ios=${IOS_BENCH_OUTCOME}, android=${ANDROID_BENCH_OUTCOME})."
            exit 1
          fi

          ios_summary=results/ios/mobench/ci/ios/summary.json
          android_summary=results/android/mobench/ci/android/summary.json

          if [ ! -f "${ios_summary}" ] || [ ! -f "${android_summary}" ]; then
            echo "::error::Refusing to publish a partial snapshot; both platform summaries are required."
            exit 1
          fi

          published_dir="caller/${CRATE_PATH}/results"
          mkdir -p "${published_dir}/ios" "${published_dir}/android"

          cp "${ios_summary}" "${published_dir}/ios/summary.json"
          cp "${android_summary}" "${published_dir}/android/summary.json"
          rm -f "${published_dir}/ios/.gitkeep" "${published_dir}/android/.gitkeep"

          timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          run_url="https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"

          # summary.json's `devices` is a list of device identifiers; a snapshot run may carry several.
          extract_devices() {
            local summary="$1"
            if [ ! -f "${summary}" ]; then
              echo ""
              return 0
            fi
            jq -r '
              [(.devices // [])[] | if type == "string" then . else (.device // .name // empty) end]
              | join(", ")
            ' "${summary}" 2>/dev/null || true
          }

          ios_device=$(extract_devices "${ios_summary}")
          android_device=$(extract_devices "${android_summary}")

          jq -n \
            --arg schema "mobench-results-v1" \
            --arg status "ready" \
            --arg ts "${timestamp}" \
            --arg sha "${HEAD_SHA}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${run_url}" \
            --arg mobench "${MOBENCH_VERSION}" \
            --arg iterations "${ITERATIONS}" \
            --arg warmup "${WARMUP}" \
            --arg profile "${DEVICE_PROFILE}" \
            --arg ios_device "${ios_device}" \
            --arg android_device "${android_device}" \
            '{
              schema_version: $schema,
              status: $status,
              timestamp: $ts,
              commit_sha: $sha,
              workflow_run_id: $run_id,
              workflow_run_url: $run_url,
              mobench_version: $mobench,
              iterations: ($iterations | tonumber),
              warmup: ($warmup | tonumber),
              device_profile: $profile,
              devices: {
                ios: (if $ios_device == "" then null else $ios_device end),
                android: (if $android_device == "" then null else $android_device end)
              }
            }' > "${published_dir}/meta.json"

          {
            echo "# Mobile ZK results"
            echo
            echo "- **Status:** ready"
            echo "- **Updated:** ${timestamp}"
            echo "- **Commit:** \`${HEAD_SHA}\`"
            echo "- **Workflow run:** [${GITHUB_RUN_ID}](${run_url})"
            echo "- **mobench:** ${MOBENCH_VERSION}"
            echo "- **Iterations / warmup:** ${ITERATIONS} / ${WARMUP}"
            echo "- **Device profile:** ${DEVICE_PROFILE}"
            if [ -n "${ios_device}" ]; then
              echo "- **iOS devices:** ${ios_device}"
            fi
            if [ -n "${android_device}" ]; then
              echo "- **Android devices:** ${android_device}"
            fi
            echo
            if [ -f rendered/ios/github-summary.md ]; then
              echo "## iOS"
              echo
              cat rendered/ios/github-summary.md
              echo
            else
              echo "## iOS"
              echo
              echo "See \`ios/summary.json\` (markdown summary unavailable for this run)."
              echo
            fi
            if [ -f rendered/android/github-summary.md ]; then
              echo "## Android"
              echo
              cat rendered/android/github-summary.md
              echo
            else
              echo "## Android"
              echo
              echo "See \`android/summary.json\` (markdown summary unavailable for this run)."
              echo
            fi
          } > "${published_dir}/LATEST.md"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          branch="chore/mobench-results-${GITHUB_RUN_ID}"

          git -C caller config user.name "github-actions[bot]"
          git -C caller config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C caller remote set-url origin "${remote}"
          git -C caller checkout -B "${branch}"
          git -C caller add "${CRATE_PATH}/results"

          if git -C caller diff --cached --quiet; then
            echo "No checked-in results changes to commit."
            exit 0
          fi

          git -C caller commit -m "chore(mobench): refresh mobile ZK results"

          if ! git -C caller push -u origin "HEAD:${branch}"; then
            echo "::error::Failed to push results branch ${branch}."
            exit 1
          fi

          pr_body="$(cat <<EOF
          ## Summary
          Refresh checked-in BrowserStack results from [workflow run ${GITHUB_RUN_ID}](${run_url}).

          - Benchmarked commit: \`${HEAD_SHA}\`
          - mobench: ${MOBENCH_VERSION}
          - Iterations / warmup: ${ITERATIONS} / ${WARMUP}
          - Device profile: ${DEVICE_PROFILE}

          ## Test plan
          - [ ] Review \`LATEST.md\` / \`meta.json\` diffs
          - [ ] Confirm device profile and platforms look right
          - [ ] Merge to adopt these numbers as the in-repo snapshot
          EOF
          )"

          pr_url=$(gh pr create \
            --repo "${GH_REPO}" \
            --base "${default_branch}" \
            --head "${branch}" \
            --title "chore(mobench): refresh mobile ZK results" \
            --body "${pr_body}")

          echo "Opened results refresh PR: ${pr_url}"
          echo "::notice::Results refresh PR: ${pr_url}"
