name: Mobile Bench PR Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write

jobs:
  dispatch:
    uses: worldcoin/mobile-bench-rs/.github/workflows/reusable-pr-command.yml@a05a80c68be8384e8d4c3d4406348e78b113de6a # main https://github.com/worldcoin/mobile-bench-rs/commit/a05a80c68be8384e8d4c3d4406348e78b113de6a
    with:
      benchmark_workflow: .github/workflows/mobile-bench.yml
      crate_path: ./crates/zk-mobile-bench
      functions: '["zk_mobile_bench::bench_nullifier_proof_generation","zk_mobile_bench::bench_nullifier_witness_generation_only","zk_mobile_bench::bench_nullifier_proving_only","zk_mobile_bench::bench_query_proof_generation","zk_mobile_bench::bench_query_cached_proof_generation","zk_mobile_bench::bench_query_witness_generation_only","zk_mobile_bench::bench_query_proving_only","zk_mobile_bench::bench_ownership_proof_generation"]'
