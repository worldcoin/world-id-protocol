[package]
edition = "2021"
name = "semaphore-rs-trees"
version = "0.6.0"
authors = [
    "Remco Bloemen <remco@worldcoin.org>",
    "Philipp Sippl <philipp@worldcoin.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust support library for Semaphore"
homepage = "https://github.com/worldcoin/semaphore-rs"
readme = false
keywords = [
    "worldcoin",
    "protocol",
    "signup",
]
categories = ["cryptography"]
license = "MIT"
repository = "https://github.com/worldcoin/semaphore-rs"

[lib]
name = "semaphore_rs_trees"
path = "src/lib.rs"

[[test]]
name = "equivalent"
path = "tests/equivalent.rs"

[dependencies.ark-bn254]
version = "0.6.0"

[dependencies.ark-ec]
version = "0.6.0"
features = ["parallel"]
default-features = false

[dependencies.ark-ff]
version = "0.6.0"
features = [
    "parallel",
    "asm",
]
default-features = false

[dependencies.ark-groth16]
version = "0.6.0"
features = ["parallel"]

[dependencies.ark-relations]
version = "0.6.0"
default-features = false

[dependencies.ark-std]
version = "0.6.0"
features = ["parallel"]
default-features = false

[dependencies.bytemuck]
version = "1.18"

[dependencies.color-eyre]
version = "0.6"

[dependencies.derive-where]
version = "1.6.0"

[dependencies.hex]
version = "0.4.0"

[dependencies.hex-literal]
version = "0.4"

[dependencies.itertools]
version = "0.13"

[dependencies.once_cell]
version = "1.8"

[dependencies.rayon]
version = "1.5.1"

[dependencies.ruint]
version = "1.12.3"
features = [
    "rand",
    "bytemuck",
    "serde",
    "num-bigint",
    "ark-ff-06",
]

[dependencies.semaphore-rs-ark-circom]
version = "0.6.0"

[dependencies.semaphore-rs-hasher]
version = "0.6.0"

[dependencies.semaphore-rs-storage]
version = "0.6.0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.thiserror]
version = "1.0.0"

[dependencies.tiny-keccak]
version = "2.0.2"
features = [
    "sha3",
    "keccak",
    "sha3",
]

[dev-dependencies.rand]
version = "0.8.4"
features = ["small_rng"]

[dev-dependencies.semaphore-rs-keccak]
version = "0.6.0"

[dev-dependencies.semaphore-rs-poseidon]
version = "0.6.0"

[dev-dependencies.serial_test]
version = "3"

[dev-dependencies.tempfile]
version = "3.0"

[dev-dependencies.test-case]
version = "3.3.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.mmap-rs]
version = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2.15"
features = ["js"]
