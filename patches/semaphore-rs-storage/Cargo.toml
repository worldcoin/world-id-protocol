[package]
edition = "2021"
name = "semaphore-rs-storage"
version = "0.6.0"
authors = [
    "Remco Bloemen <remco@worldcoin.org>",
    "Philipp Sippl <philipp@worldcoin.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust support library for Semaphore"
homepage = "https://github.com/worldcoin/semaphore-rs"
readme = false
keywords = [
    "worldcoin",
    "protocol",
    "signup",
]
categories = ["cryptography"]
license = "MIT"
repository = "https://github.com/worldcoin/semaphore-rs"

[lib]
name = "semaphore_rs_storage"
path = "src/lib.rs"

[dependencies.bytemuck]
version = "1.18"

[dependencies.color-eyre]
version = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.mmap-rs]
version = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tempfile]
version = "3.0"
